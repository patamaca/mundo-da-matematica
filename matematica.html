<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mundo da Matemática 🌟</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#f0f9ff 0%,#fef3c7 50%,#fdf2f8 100%);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:1rem}
.wrap{background:white;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.12);width:100%;max-width:580px;padding:1.5rem;position:relative;overflow:hidden;margin-top:.5rem}
.wrap::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#10b981,#3b82f6,#8b5cf6,#f59e0b)}

/* ONBOARD */
.onboard{text-align:center;padding:1rem 0}
.onboard-title{font-size:24px;font-weight:800;color:#0f172a;margin-bottom:4px}
.onboard-sub{font-size:14px;color:#64748b;margin-bottom:1.2rem}
.name-input{width:100%;max-width:280px;padding:12px 16px;font-size:20px;font-weight:700;border:2.5px solid #e2e8f0;border-radius:14px;text-align:center;outline:none;color:#0f172a;transition:border-color .2s}
.name-input:focus{border-color:#3b82f6}
.avatar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:1rem auto;max-width:320px}
.av-btn{font-size:34px;border:3px solid transparent;border-radius:14px;padding:8px;cursor:pointer;background:white;transition:all .15s;line-height:1}
.av-btn:hover{transform:scale(1.12);background:#f0f9ff}
.av-btn.selected{border-color:#3b82f6;background:#eff6ff;transform:scale(1.1)}
.start-btn{margin-top:1rem;padding:14px 40px;font-size:17px;font-weight:800;background:linear-gradient(135deg,#10b981,#3b82f6);color:white;border:none;border-radius:16px;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(59,130,246,.4)}
.start-btn:hover{transform:scale(1.04);filter:brightness(1.05)}
.start-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* WORLD MAP */
.map-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.player-tag{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:#0f172a}
.player-tag .av{font-size:28px}
.total-pts{background:#fef9c3;color:#854d0e;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px}

/* STATION PANEL */
.st-panel{border-radius:16px;padding:14px 16px;margin-top:10px;border:2.5px solid transparent;transition:background .25s,border-color .25s}
.st-panel-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.st-icon-big{font-size:36px;line-height:1;flex-shrink:0}
.st-info{flex:1;min-width:0}
.st-name{font-size:17px;font-weight:800;color:#0f172a;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-mod{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;display:inline-block;margin-bottom:3px}
.st-topic{font-size:12px;color:#64748b;line-height:1.3}
.st-status{font-size:12px;font-weight:600;margin-left:auto;flex-shrink:0;padding:4px 10px;border-radius:99px;white-space:nowrap}
.st-status.done{background:#d1fae5;color:#065f46}
.st-status.cur{background:#fef9c3;color:#854d0e}
.st-status.next{background:#f1f5f9;color:#64748b}
.play-now-btn{width:100%;padding:13px;font-size:16px;font-weight:800;color:white;border:none;border-radius:14px;cursor:pointer;transition:all .2s}
.play-now-btn:hover{filter:brightness(1.08);transform:scale(1.02)}
.map-link{background:none;border:none;cursor:pointer;font-size:12px;color:#94a3b8;padding:0}
.map-link:hover{color:#64748b}

/* WORLD CARDS on map */
.map-worlds{margin-top:14px}
.map-worlds-title{font-size:13px;font-weight:700;color:#64748b;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.map-world-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mwcard{border-radius:14px;padding:10px 12px;cursor:pointer;transition:all .18s;border:2px solid transparent;display:flex;align-items:center;gap:10px}
.mwcard:hover{transform:scale(1.02)}
.mwcard.active{border-width:2.5px}
.mwcard-icon{font-size:26px;line-height:1;flex-shrink:0}
.mwcard-name{font-size:13px;font-weight:800;margin-bottom:1px}
.mwcard-desc{font-size:11px;opacity:.75}
.topics-panel{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:7px;animation:fadeIn .2s ease}
.tpbtn{padding:9px 10px;border-radius:12px;border:1.5px solid transparent;cursor:pointer;text-align:left;transition:all .15s;background:white;display:flex;align-items:center;gap:8px}
.tpbtn:hover{transform:scale(1.02)}
.tpbtn-icon{font-size:18px;flex-shrink:0}
.tpbtn-name{font-size:12px;font-weight:700;margin-bottom:1px}
.tpbtn-hint{font-size:10px;opacity:.7}
.surprise-btn{width:100%;margin-top:12px;padding:14px;font-size:16px;font-weight:800;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:white;border:none;border-radius:16px;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(139,92,246,.35);display:flex;align-items:center;justify-content:center;gap:8px}
.surprise-btn:hover{transform:scale(1.02);filter:brightness(1.08)}

/* MEDALS */
.medals-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.medal{font-size:24px;cursor:default;position:relative}
.medal.locked{filter:grayscale(1);opacity:.3}
.medal[title]:hover::after{content:attr(title);position:absolute;bottom:130%;left:50%;transform:translateX(-50%);background:#0f172a;color:white;font-size:11px;padding:3px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:10}

/* HOME */
.home-title{text-align:center;font-size:26px;font-weight:800;color:#0f172a;margin:.4rem 0 4px}
.home-sub{text-align:center;font-size:14px;color:#64748b;margin-bottom:1.2rem}
.world-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wcard{border-radius:18px;padding:1.1rem 1rem;cursor:pointer;transition:all .18s;border:2px solid transparent}
.wcard:hover{transform:translateY(-3px) scale(1.02)}
.wcard:active{transform:scale(.97)}
.wc-icon{font-size:36px;margin-bottom:6px;display:block}
.wc-name{font-size:15px;font-weight:700;margin-bottom:3px}
.wc-desc{font-size:12px;opacity:.8;line-height:1.4}
.w-soma{background:#d1fae5;color:#065f46;border-color:#6ee7b7}
.w-algo{background:#dbeafe;color:#1e3a5f;border-color:#93c5fd}
.w-mult{background:#ede9fe;color:#3b1f8c;border-color:#c4b5fd}
.w-dist{background:#fef3c7;color:#78350f;border-color:#fcd34d}

/* TOPICS */
.back-btn{background:none;border:none;cursor:pointer;font-size:14px;color:#64748b;padding:4px 0;margin-bottom:12px;display:flex;align-items:center;gap:4px}
.back-btn:hover{color:#0f172a}
.mod-header{text-align:center;margin-bottom:1rem}
.mod-title{font-size:20px;font-weight:800;color:#0f172a;margin-bottom:4px}
.mod-desc{font-size:14px;color:#64748b}
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbtn{padding:1rem;border-radius:14px;border:2px solid transparent;cursor:pointer;text-align:left;transition:all .15s;background:white}
.tbtn:hover{transform:scale(1.02)}
.tc-icon{font-size:26px;margin-bottom:4px;display:block}
.tc-name{font-size:13px;font-weight:700}
.tc-hint{font-size:11px;opacity:.75;margin-top:2px}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:6px}
.hearts{display:flex;gap:4px}
.heart{font-size:22px;transition:all .3s}
.heart.lost{opacity:.2;transform:scale(.7)}
.badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}
.b-mod{background:#e0f2fe;color:#0369a1}
.b-sc{background:#dcfce7;color:#166534}
.b-str{background:#fef9c3;color:#854d0e}
.tbar,.pbar{height:7px;background:#f1f5f9;border-radius:99px;overflow:hidden;margin:4px 0}
.tfill{height:100%;background:#3b82f6;border-radius:99px;transition:width .1s linear}
.tfill.warn{background:#ef4444}
.pfill{height:100%;border-radius:99px;transition:width .4s ease}
.qcount{text-align:right;font-size:12px;color:#94a3b8;margin-bottom:4px}

/* NARRATOR */
.narrator{display:flex;align-items:flex-end;gap:10px;margin-bottom:8px}
.narrator-av{font-size:36px;line-height:1;flex-shrink:0;transition:transform .3s}
.narrator-av.ok{animation:avjump .5s ease}
.narrator-av.err{animation:avshake .4s ease}
@keyframes avjump{0%,100%{transform:translateY(0)}30%{transform:translateY(-14px) scale(1.15)}60%{transform:translateY(-6px)}}
@keyframes avshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.bubble{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:13px;font-weight:600;color:#374151;max-width:calc(100% - 56px);line-height:1.4;transition:all .3s}
.bubble.ok{background:#d1fae5;border-color:#6ee7b7;color:#065f46}
.bubble.err{background:#fee2e2;border-color:#fca5a5;color:#991b1b}

/* QUESTION CARD */
.qcard{border-radius:18px;padding:1.2rem 1rem;margin:.5rem 0;border:2px solid transparent;transition:background .3s,border-color .3s}
.qcard.theme-soma{background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border-color:#a7f3d0}
.qcard.theme-algo{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-color:#93c5fd}
.qcard.theme-mult{background:linear-gradient(135deg,#f5f3ff,#ede9fe);border-color:#c4b5fd}
.qcard.theme-dist{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fde68a}
.story{font-size:15px;color:#475569;line-height:1.7;margin-bottom:6px}
.story b{color:#0f172a}
.story em{color:#7c3aed;font-style:normal;font-weight:700}
.qtxt{font-size:18px;font-weight:800;color:#0f172a;margin:8px 0 14px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:400px;margin:0 auto}
.cbtn{padding:18px;font-size:24px;font-weight:800;border:2.5px solid #e2e8f0;border-radius:16px;background:white;color:#1e293b;cursor:pointer;transition:all .15s;box-shadow:0 3px 8px rgba(0,0,0,.06)}
.cbtn:hover:not(:disabled){background:#f1f5f9;transform:scale(1.06);border-color:#94a3b8}
.cbtn.ok{background:#d1fae5;border-color:#059669;color:#065f46;animation:cpop .5s ease}
.cbtn.err{background:#fee2e2;border-color:#dc2626;color:#991b1b;animation:shake .4s ease}
@keyframes cpop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{font-size:14px;font-weight:600;min-height:22px;margin:10px 0 0;text-align:center}
.fb.ok{color:#059669}.fb.err{color:#dc2626}
.strategy{margin-top:8px;padding:10px 14px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;font-size:13px;color:#78350f;line-height:1.5;text-align:center}
.stars{display:flex;gap:6px;justify-content:center;margin:6px 0 0}
.star{font-size:22px}

/* PAGE TRANSITION */
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease forwards}

/* WORD PROBLEM SCENE */
.scene-word{background:white;border:2px solid #e2e8f0;border-radius:14px;padding:10px 8px;margin:8px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;overflow-x:auto}
.sg{text-align:center;padding:8px 14px;border-radius:12px;background:#f8fafc;border:1.5px solid #e2e8f0;min-width:80px}
.sg-num{font-size:32px;font-weight:800}
.sg-lbl{font-size:12px;color:#64748b;margin-top:2px}
.sg-emoji{font-size:24px;margin-bottom:2px}
.scene-op{font-size:30px;font-weight:700;color:#94a3b8}

/* ALGORITHM */
.algo-wrap{text-align:center;margin:8px 0}
.algo-box{display:inline-flex;flex-direction:column;background:white;border:2px solid #e2e8f0;border-radius:14px;padding:14px 20px;min-width:130px}
.algo-row{display:flex;justify-content:flex-end;align-items:center;gap:0;margin:1px 0;position:relative}
.ad{width:38px;height:42px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#0f172a;font-family:'Courier New',monospace}
.ad.carry{height:20px;font-size:13px;font-weight:700;color:#dc2626}
.ad.borrow{height:20px;font-size:13px;font-weight:700;color:#7c3aed}
.ad.struck{text-decoration:line-through;color:#94a3b8}
.ad.new-val{color:#7c3aed}
.algo-op-col{width:38px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#64748b}
.algo-line{border-top:2.5px solid #0f172a;margin:4px 0 2px}
.algo-res .ad{color:#7c3aed}
.ad.q{color:#94a3b8}

/* ARRAY */
.array-scene{background:#fdf4ff;border:2px solid #e9d5ff;border-radius:14px;padding:14px;margin:8px 0;text-align:center}
.array-grid{display:inline-flex;flex-direction:column;gap:5px;margin-bottom:8px}
.array-row{display:flex;gap:5px;justify-content:center}
.array-cell{font-size:20px;line-height:1}
.array-lbl{font-size:13px;color:#7c3aed;font-weight:600}

/* GROUPS SCENE */
.groups-scene{border-radius:14px;padding:12px;margin:8px 0;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.openbox{border-radius:12px;padding:9px 11px;text-align:center;border:2.5px dashed;background:white}
.closedbox{border-radius:12px;padding:9px 11px;text-align:center;border:1.5px solid;background:white}
.boxtag{font-size:11px;font-weight:600;margin-top:4px}
.plus-sep{font-size:20px;font-weight:700}
.extra-lbl{font-size:14px;font-weight:700;padding:0 4px}

/* DISTRIBUTION */
.dist-scene{background:#fffbeb;border:2px solid #fde68a;border-radius:14px;padding:12px;margin:8px 0}
.dist-total-row{text-align:center;margin-bottom:10px}
.dt-emoji-row{font-size:18px;line-height:1.6;word-break:break-all;max-width:100%}
.dt-lbl{font-size:13px;color:#92400e;font-weight:600;margin-top:4px}
.dist-arrow{text-align:center;font-size:20px;color:#d97706;margin:4px 0}
.dist-groups-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dg{background:white;border:2px dashed #fcd34d;border-radius:12px;padding:8px 10px;text-align:center;min-width:58px}
.dg-lbl{font-size:11px;color:#92400e;font-weight:600;margin-bottom:4px}
.dg-q{font-size:24px;color:#d97706}
.mult-hint{font-size:12px;color:#92400e;text-align:center;margin-top:8px;font-style:italic}

/* END */
.end-screen{text-align:center;padding:1.5rem 1rem 1rem}
.bigmoji{font-size:68px;animation:bounce .6s ease infinite alternate;display:block;margin-bottom:8px}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-12px)}}
.end-title{font-size:22px;font-weight:800;color:#0f172a;margin:8px 0 6px}
.end-sub{font-size:15px;color:#64748b}
.end-stats{display:flex;gap:10px;justify-content:center;margin:1rem 0;flex-wrap:wrap}
.sc{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:14px;padding:10px 16px;min-width:90px}
.sc-val{font-size:26px;font-weight:800;color:#0f172a}
.sc-lbl{font-size:12px;color:#94a3b8;margin-top:2px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1rem}
.btn{padding:12px 24px;font-size:14px;font-weight:700;border:none;border-radius:12px;cursor:pointer;transition:all .15s}
.btn:hover{transform:scale(1.04)}
.btn-p{color:white}
.btn-p:hover{filter:brightness(.9)}
.btn-s{background:#f1f5f9;color:#475569;border:1.5px solid #e2e8f0}
.btn-s:hover{background:#e2e8f0}
.new-medals{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.new-medal-row{background:#fef9c3;border:1.5px solid #fde68a;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;color:#78350f;display:flex;align-items:center;gap:8px;animation:fadeIn .4s ease}

/* Confetti */
@keyframes cf{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(80px) rotate(360deg);opacity:0}}
.cp{position:absolute;width:9px;height:9px;border-radius:2px;animation:cf 1.2s ease-out forwards;pointer-events:none}

/* ── MOBILE ── */
@media(max-width:520px){
  body{padding:.4rem}
  .wrap{padding:1rem .85rem;border-radius:16px;margin-top:0}
  .onboard-title{font-size:20px}
  .avatar-grid{grid-template-columns:repeat(5,1fr);gap:6px}
  .av-btn{font-size:28px;padding:5px}
  .name-input{font-size:17px}
  .map-header{margin-bottom:7px}
  .player-tag{font-size:13px}
  .player-tag .av{font-size:22px}
  .total-pts{font-size:12px}
  /* station panel */
  .st-panel{padding:10px 11px}
  .st-panel-top{flex-wrap:wrap;gap:8px}
  .st-icon-big{font-size:28px}
  .st-name{font-size:14px}
  .st-status{margin-left:0;font-size:11px}
  .play-now-btn{font-size:14px;padding:11px}
  /* worlds */
  .map-worlds-title{font-size:12px}
  .mwcard{padding:8px 9px;gap:7px}
  .mwcard-icon{font-size:22px}
  .mwcard-name{font-size:12px}
  .mwcard-desc{font-size:10px}
  .tpbtn{padding:8px 9px;gap:6px}
  .tpbtn-icon{font-size:15px}
  .tpbtn-name{font-size:11px}
  .surprise-btn{font-size:14px;padding:12px}
  /* game */
  .choices{max-width:100%}
  .cbtn{padding:14px;font-size:20px}
  .hud{gap:4px}
  .badge{font-size:11px;padding:2px 7px}
  .heart{font-size:19px}
  .qtxt{font-size:16px}
  .story{font-size:13px}
  /* algo */
  .ad{width:30px;height:36px;font-size:22px}
  .algo-op-col{width:30px;height:36px;font-size:19px}
  .ad.carry,.ad.borrow{height:16px;font-size:11px}
  /* end */
  .end-screen{padding:1rem .5rem .5rem}
  .bigmoji{font-size:52px}
  .end-title{font-size:18px}
  .sc-val{font-size:22px}
  .btns{gap:7px}
  .btn{padding:10px 16px;font-size:13px}
  /* narrator */
  .narrator-av{font-size:28px}
  .bubble{font-size:12px;padding:6px 10px}
}
@media(max-width:360px){
  .map-world-grid{grid-template-columns:1fr}
  .topics-panel{grid-template-columns:1fr}
  .av-btn{font-size:24px;padding:4px}
  .cbtn{padding:12px;font-size:18px}
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
<div id="app"></div>
</div>
<script>
/* ── DB ── */
let _db=null;
(async()=>{try{_db=await claude.use('db')}catch(e){_db=null}})();

async function logSession(){
  if(!_db||!P.name||!S.score)return;
  try{
    const ts=Date.now();
    const bonusMult=S._dailyBonus?2:1;
    await _db.collection('sessions').doc(String(ts)).set({
      player:P.name,
      avatar:P.avatar,
      mod:S.mod,
      topic:S.topic,
      score:S.score*bonusMult,
      baseScore:S.score,
      correct:S.qNum,
      maxStreak:S.maxStreak,
      livesLeft:S.lives,
      stars:S.stars,
      daily:S._dailyBonus?true:false,
      ts,
      date:new Date(ts).toISOString().slice(0,10)
    });
    // Update per-player aggregate
    const psnap=await _db.doc('players/'+encodePlayer(P.name)).get();
    const prev=psnap.exists?psnap.data():{player:P.name,avatar:P.avatar,totalScore:0,sessions:0,bestScore:0,lastSeen:''};
    await _db.doc('players/'+encodePlayer(P.name)).set({
      player:P.name,
      avatar:P.avatar,
      totalScore:(prev.totalScore||0)+(S.score*bonusMult),
      sessions:(prev.sessions||0)+1,
      bestScore:Math.max(prev.bestScore||0,S.score*bonusMult),
      lastSeen:new Date(ts).toISOString().slice(0,10)
    });
  }catch(e){}
}
function encodePlayer(n){return n.toLowerCase().replace(/[^a-z0-9]/g,'-').slice(0,50)||'player'}

/* ── SOUNDS ── */

/* ── QUESTION GENERATORS ── */
function genChoices(ans){
  const w=new Set();
  const cs=[ans-1,ans+1,ans-2,ans+2,ans-5,ans+5,ans-10,ans+10,ans-3,ans+3];
  for(const c of cs){if(c>0&&c!==ans&&w.size<3)w.add(c)}
  while(w.size<3){const v=ans+(Math.random()>.5?1:-1)*ri(1,8);if(v>0&&v!==ans)w.add(v)}
  const all=[ans,...w];
  for(let i=all.length-1;i>0;i--){const j=ri(0,i);[all[i],all[j]]=[all[j],all[i]]}
  return all;
}
function noCarry(a,b){return(a%10+b%10<10)&&(Math.floor(a/10)+Math.floor(b/10)<10)&&a+b<=99}
function hasCarry(a,b){return a%10+b%10>=10&&a+b<=99}
function noBorrow(a,b){return a%10>=b%10&&a>b&&a-b>=5}
function hasBorrow(a,b){return a%10<b%10&&a>b&&a-b>=5}
function genAdd(withCarry){
  let a,b;
  for(let i=0;i<200;i++){a=ri(12,68);b=ri(11,68);if(withCarry&&hasCarry(a,b))return{a,b,op:'+',ans:a+b};if(!withCarry&&noCarry(a,b))return{a,b,op:'+',ans:a+b}}
  return{a:23,b:14,op:'+',ans:37};
}
function genSub(withBorrow){
  let a,b;
  for(let i=0;i<200;i++){a=ri(21,89);b=ri(11,a-5);if(withBorrow&&hasBorrow(a,b))return{a,b,op:'-',ans:a-b};if(!withBorrow&&noBorrow(a,b))return{a,b,op:'-',ans:a-b}}
  return{a:57,b:23,op:'-',ans:34};
}
function addStrategy(a,b){const bT=Math.floor(b/10)*10,bU=b%10;if(bU===0)return`${a} + ${b} = ${a+b}`;return`${a} + ${b} = ${a} + ${bT} + ${bU} = ${a+bT} + ${bU} = ${a+b}`}
function subStrategy(a,b){const bT=Math.floor(b/10)*10,bU=b%10;if(bU===0)return`${a} − ${b} = ${a-b}`;return`${a} − ${b} = ${a} − ${bT} − ${bU} = ${a-bT} − ${bU} = ${a-b}`}

  (ch,it,a,b)=>`Na cesta havia <b>${a} ${it.p}</b>. Depois de usar <b>${b}</b>, quantos restaram?`,

const SUB_QUESTIONS=['Quantos(as) sobraram?','Qual é a diferença?','Quantos(as) restaram?'];
function genWordQ(tid){
  const withCarry=tid==='add_carry',withBorrow=tid==='sub_borrow',isAdd=tid.startsWith('add');
  const nums=isAdd?genAdd(withCarry):genSub(withBorrow);
  const it=pick(ITEMS),ch=pick(Math.random()>.5?CHARS_F:CHARS_M);
  const story=isAdd?pick(ADD_STORIES)(ch,it,nums.a,nums.b):pick(SUB_STORIES)(ch,it,nums.a,nums.b);
  const q=isAdd?pick(ADD_QUESTIONS):pick(SUB_QUESTIONS);
  const strat=isAdd?addStrategy(nums.a,nums.b):subStrategy(nums.a,nums.b);
  return{...nums,it,ch,story,q,strat,type:'word',choices:genChoices(nums.ans)};
}
function genAlgoQ(tid){
  const withCarry=tid==='algo_add_c',withBorrow=tid==='algo_sub_b',isAdd=tid.startsWith('algo_add');
  const nums=isAdd?genAdd(withCarry):genSub(withBorrow);
  const strat=isAdd?addStrategy(nums.a,nums.b):subStrategy(nums.a,nums.b);
  return{...nums,strat,type:'algo',choices:genChoices(nums.ans)};
}
function genMultQ(tid){
  const tableMap={mult_2:[2],mult_3:[3],mult_45:[4,5],mult_10:[10]};
  const gs=pick(tableMap[tid]||[2]),ng=ri(2,10),ans=ng*gs;

  return{ng,gs,ans,useArray:Math.random()>.45,sc,ch,type:'mult',choices:genChoices(ans),story:sc.stFn(ch,ng,gs),q:'Quantos ao todo?'};
}
function genDistQ(tid){
  const groupMap={dist_2:[2],dist_3:[3],dist_45:[4,5],dist_10:[10]};
  const groups=pick(groupMap[tid]||[2]),each=ri(2,10),total=groups*each;

}
const ALL_TOPICS=['add_easy','add_carry','sub_easy','sub_borrow','algo_add','algo_add_c','algo_sub','algo_sub_b','mult_2','mult_3','mult_45','mult_10','dist_2','dist_3','dist_45','dist_10'];

function genQ(tid){
  if(tid==='daily')tid=pick(ALL_TOPICS);

  if(tid.startsWith('algo'))return genAlgoQ(tid);

  if(tid.startsWith('dist'))return genDistQ(tid);

}

  for(let i=0;i<show;i++)cl+=`<div class="closedbox" style="border-color:${sc.bdl}"><div style="font-size:26px;margin-bottom:3px">${sc.box}</div><div class="boxtag" style="color:#94a3b8">fechada</div></div>`;
  if(extra>0)cl+=`<div class="extra-lbl" style="color:${sc.bd}">+${extra} mais</div>`;
  return`<div class="groups-scene" style="background:${sc.bg};border:1.5px solid ${sc.bdl}">${open}${ng>1?`<span class="plus-sep" style="color:${sc.bd}">+</span>`:''}${cl}</div>`;
}
function renderArray(q){
  const{ng,gs}=q,em=pick(MULT_EMOJIS);
  const rows=[];
  for(let r=0;r<ng;r++){const cells=[];for(let c=0;c<gs;c++)cells.push(`<span class="array-cell">${em}</span>`);rows.push(`<div class="array-row">${cells.join('')}</div>`)}
  return`<div class="array-scene"><div class="array-grid">${rows.join('')}</div><div class="array-lbl">${ng} linhas × ${gs} colunas = ?</div></div>`;
}
function renderDist(q,showAns){
  const{total,groups,each,it}=q;
  const maxShow=Math.min(total,30),extra=total-maxShow;
  let emojiRow=it.e.repeat(maxShow);
  if(extra>0)emojiRow+=` <span style="font-size:13px;color:#92400e">+${extra}</span>`;
  let groupsHtml='';
  for(let i=0;i<groups;i++)groupsHtml+=`<div class="dg"><div class="dg-lbl">Amigo ${i+1}</div><div class="dg-q">${showAns?each+'<br><span style="font-size:14px">'+it.e.repeat(Math.min(each,5))+'</span>':'?'}</div></div>`;
  return`<div class="dist-scene"><div class="dist-total-row"><div class="dt-emoji-row">${emojiRow}</div><div class="dt-lbl">Total: ${total} ${it.p}</div></div><div class="dist-arrow">↓ dividir em ${groups} grupos iguais</div><div class="dist-groups-row">${groupsHtml}</div>${!showAns?`<div class="mult-hint">Dica: qual número × ${groups} = ${total}?</div>`:''}</div>`;
}
function renderVisual(q,showAns){
  if(q.type==='word')return renderWordScene(q);
  if(q.type==='algo')return renderAlgo(q,showAns);
  if(q.type==='mult')return q.useArray?renderArray(q):renderGroups(q,showAns);
  if(q.type==='dist')return renderDist(q,showAns);
  return '';
}

/* ── STATE ── */
const T=60,TQ=10;
let S={screen:P.name?'map':'onboard',mod:null,topic:null,score:0,streak:0,maxStreak:0,lives:3,qNum:0,q:null,answered:false,selected:null,fb:'',fbType:'',timer:T,tid:null,stars:0,narratorMsg:'',narratorState:'',_fastAns:false,newMedals:[],_selSt:null,_selMod:null};

function startTimer(){
  clearInterval(S.tid);S.timer=T;
  S.tid=setInterval(()=>{S.timer--;updBar();
    if(S.timer<=8&&S.timer>0)playTick();
    if(S.timer<=0){clearInterval(S.tid);if(!S.answered)onAns(null,true)}
  },1000);
}
function updBar(){const f=document.getElementById('tf');if(!f)return;const p=(S.timer/T)*100;f.style.width=p+'%';f.className='tfill'+(p<30?' warn':'')}

function onAns(val,timeout){
  if(S.answered)return;
  clearInterval(S.tid);S.answered=true;S.selected=val;
  const ok=val===S.q.ans;
  S._fastAns=ok&&S.timer>=(T-10);
  if(ok){
    const pts=S.timer>40?15:S.timer>20?10:5;
    const cb=S.streak>=2?5:0;
    S.score+=pts+cb;S.streak++;if(S.streak>S.maxStreak)S.maxStreak=S.streak;
    S.fb=S.streak>=3?`Combo x${S.streak}! 🎉  ${S.q.ans} (+${pts+cb} pts)`:`Correto! 🎉  (+${pts+cb} pts)`;
    S.fbType='ok';
    S.narratorMsg=S.streak>=3?pick(NARRATOR_COMBO):pick(NARRATOR_OK);
    S.narratorState='ok';
    playOk(S.streak);if(S.streak>=3)confetti();
  } else {
    S.lives--;S.streak=0;
    S.fb=timeout?`Tempo! ⏱  Resposta: ${S.q.ans}`:`Ops! 😅  Resposta: ${S.q.ans}`;
    S.fbType='err';
    S.narratorMsg=timeout?pick(NARRATOR_TIMEOUT):pick(NARRATOR_ERR);
    S.narratorState='err';
    timeout?playTime():playErr();
  }
  S.stars=S.score>=120?3:S.score>=70?2:S.score>=30?1:0;
  render();
  if(S.lives<=0){setTimeout(()=>{finishGame();},3500);return}
  setTimeout(()=>{
    S.qNum++;
    if(S.qNum>=TQ){finishGame();return}
    S.q=genQ(S.topic);S.answered=false;S.selected=null;S.fb='';
    S.narratorMsg=pick(NARRATOR_IDLE);S.narratorState='';
    render();startTimer();
  },5000);
}

function finishGame(){
  if(P.name&&S.score>0){
    if(!S._offTrack){
      P.totalScore+=S.score;
      P.station=Math.floor(P.totalScore/PTS_PER_STATION);
    }
    if(S.mod!=='daily'){
      if(S.mod==='soma')P.somaRounds=(P.somaRounds||0)+1;
      if(S.mod==='mult')P.multRounds=(P.multRounds||0)+1;
      if(S.mod==='dist')P.distRounds=(P.distRounds||0)+1;
      if(S.mod==='algo')P.algoRounds=(P.algoRounds||0)+1;
    }
    const prevMedals=[...P.medals];
    S.newMedals=checkMedals(prevMedals);
    savePlayer();
    logSession();
  }
  S.screen='end';render();
}

function startGame(modId,topicId){
  clearInterval(S.tid);
  S={...S,screen:'game',mod:modId,topic:topicId,score:0,streak:0,maxStreak:0,lives:3,qNum:0,answered:false,selected:null,fb:'',fbType:'',stars:0,_fastAns:false,newMedals:[],narratorMsg:pick(NARRATOR_IDLE),narratorState:''};
  S.q=genQ(topicId);render();startTimer();
}
function goHome(){clearInterval(S.tid);S._selSt=null;S._selMod=null;S._offTrack=false;S.screen=P.name?'map':'onboard';render()}
function toggleMod(modId){S._selMod=S._selMod===modId?null:modId;render()}
function surpriseMe(){
  const m=pick(MODS);
  const t=pick(m.topics);
  S._offTrack=true;
  startGame(m.id,t.id);
}
function goTopics(modId){S.screen='topics';S.mod=modId;render()}

  if(S.screen==='topics')return renderTopics(app);

}

function renderMap(app){
  const st=P.station;
  const curIdx=st%MAP_STATIONS.length;

  // Station grid coordinates (snake path)

  for(let i=0;i<total;i++){

    pts.push({x:(row%2===0)?50+col*115:415-col*115,y:55+row*90});
  }

  let pathD=`M ${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length;i++){const p=pts[i-1],c=pts[i];pathD+=` Q ${p.x} ${c.y} ${c.x} ${c.y}`}

  const biomes=[
    {y0:0,  y1:130, c1:'#bfdbfe',c2:'#dbeafe'},

      <ellipse cx="367" cy="28" rx="28" ry="12" fill="white" opacity=".65"/>

          <div class="st-name">Estação ${selIdx+1} — ${selStn.name}</div>

      </div>
      ${isCur?`<div style="margin-bottom:10px"><div style="font-size:11px;color:#64748b;margin-bottom:3px">Progresso nesta estação</div><div style="height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden"><div style="height:100%;width:${progPct}%;background:${selStn.color};border-radius:99px;transition:width .5s"></div></div></div>`:''}

function playSelected(idx){
  const stn=MAP_STATIONS[idx];
  const curIdx=P.station%MAP_STATIONS.length;
  if(idx!==curIdx){
    // Playing a non-current station: don't advance world progress
    S._offTrack=true;
  } else {
    S._offTrack=false;
  }
  startGame(stn.mod,stn.topic);
}

function startFromMap(){
  S._offTrack=false;
  const cur=MAP_STATIONS[P.station%MAP_STATIONS.length];
  startGame(cur.mod,cur.topic);
}
function startDailyChallenge(){
  const today=new Date().toISOString().slice(0,10);
  P.lastDaily=today;savePlayer();
  S._dailyBonus=true;S._offTrack=false;
  startGame('daily','daily');
}
function changePlayer(){_selAv='';P={name:'',avatar:'',totalScore:0,station:0,medals:[],somaRounds:0,multRounds:0,distRounds:0,algoRounds:0,lastDaily:''};savePlayer();S.screen='onboard';render()}

/* ── HOME ── */
function renderHome(app){
  app.innerHTML=`<div class="fade-in">
    <button class="back-btn" onclick="goHome()">← Voltar ao Mapa</button>
    <div style="text-align:center;padding:.2rem 0 .4rem"><div style="font-size:48px">🌟</div></div>
    <div class="home-title">Escolha o Mundo</div>
    <p class="home-sub">Selecione um tema para praticar!</p>
    <div class="world-grid">
      ${MODS.map(m=>`<div class="wcard ${m.cls}" onclick="goTopics('${m.id}')">
        <span class="wc-icon">${m.icon}</span>
        <div class="wc-name">${m.name}</div>
        <div class="wc-desc">${m.desc}</div>
      </div>`).join('')}
    </div>
    <p style="text-align:center;font-size:12px;color:#94a3b8;margin-top:1rem">❤️ 3 vidas &nbsp;•&nbsp; ⏱ 60s por pergunta &nbsp;•&nbsp; 🎯 10 perguntas</p>
  </div>`;
}

/* ── TOPICS ── */
function renderTopics(app){
  const m=MODS.find(x=>x.id===S.mod);
  const tColors={soma:'#d1fae5',algo:'#dbeafe',mult:'#ede9fe',dist:'#fef3c7'};
  const tBorder={soma:'#6ee7b7',algo:'#93c5fd',mult:'#c4b5fd',dist:'#fcd34d'};
  const tText={soma:'#065f46',algo:'#1e3a5f',mult:'#3b1f8c',dist:'#78350f'};
  const bg=tColors[m.id]||'#f8fafc',bd=tBorder[m.id]||'#e2e8f0',tx=tText[m.id]||'#0f172a';
  app.innerHTML=`<div class="fade-in">
    <button class="back-btn" onclick="S.screen='home';render()">← Voltar</button>
    <div class="mod-header">
      <div style="font-size:42px;margin-bottom:6px">${m.icon}</div>
      <div class="mod-title">${m.name}</div>
      <div class="mod-desc">Escolha o tipo de exercício:</div>
    </div>
    <div class="topic-grid">
      ${m.topics.map(t=>`<div class="tbtn" style="background:${bg};border-color:${bd};color:${tx}" onclick="startGame('${m.id}','${t.id}')">
        <span class="tc-icon">${t.icon}</span>
        <div class="tc-name">${t.name}</div>
        <div class="tc-hint">${t.hint}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

/* ── GAME ── */
function renderGame(app){
  const q=S.q;
  const dispModId=S.mod==='daily'?modFromQtype(q.type):S.mod;
  const m=MODS.find(x=>x.id===dispModId)||MODS[0];
  const progress=(S.qNum/TQ)*100;
  const hearts=[1,2,3].map(i=>`<span class="heart${S.lives<i?' lost':''}">❤️</span>`).join('');
  const starsH=[1,2,3].map(i=>`<span class="star">${i<=S.stars?'⭐':'☆'}</span>`).join('');
  const choicesH=q.choices.map(c=>{
    let cl='cbtn';
    if(S.answered){if(c===q.ans)cl+=' ok';else if(c===S.selected)cl+=' err'}
    return`<button class="${cl}" onclick="onAns(${c})" ${S.answered?'disabled':''}>${c}</button>`;
  }).join('');
  const storyHtml=q.story?`<p class="story">${q.story}</p>`:'';
  const visual=renderVisual(q,S.answered);
  const stratHtml=S.answered&&q.strat?`<div class="strategy">📐 Estratégia: <b>${q.strat}</b></div>`:'';
  const multHintHtml=S.answered&&q.type==='dist'?`<div class="strategy">${q.multHint}</div>`:'';
  const narratorCl=S.narratorState?` ${S.narratorState}`:'';
  const modBadge=S.mod==='daily'?`<span class="badge" style="background:#fef9c3;color:#78350f">⚡ Desafio Diário</span><span class="badge b-mod">${m.icon} ${m.name}</span>`:`<span class="badge b-mod">${m.icon} ${m.name}</span>`;

  app.innerHTML=`<div>
    <div class="hud">
      <div class="hearts">${hearts}</div>
      <div class="badges">
        ${modBadge}
        <span class="badge b-sc">${S.score} pts</span>
        ${S.streak>=2?`<span class="badge b-str">🔥 ${S.streak}x</span>`:''}
      </div>
    </div>
    <div class="tbar"><div class="tfill" id="tf" style="width:100%"></div></div>
    <div class="pbar"><div class="pfill" style="width:${progress}%;background:${m.color}"></div></div>
    <div class="qcount">${S.qNum+1} de ${TQ}</div>
    <div class="narrator">
      <div class="narrator-av${narratorCl}" id="nav">${P.avatar||'🌟'}</div>
      <div class="bubble${S.narratorState?' '+S.narratorState:''}">${S.narratorMsg||pick(NARRATOR_IDLE)}</div>
    </div>
    <div class="qcard ${m.theme} fade-in">
      ${storyHtml}
      ${visual}
      <p class="qtxt">${q.q}</p>
      <div class="choices">${choicesH}</div>
      <div class="fb ${S.fbType}">${S.fb}</div>
      ${stratHtml}${multHintHtml}
    </div>
    <div class="stars">${starsH}</div>
  </div>`;
  updBar();
}

/* ── END ── */
function renderEnd(app){
  const m=MODS.find(x=>x.id===S.mod)||MODS[0];
  const s=S.stars;
  const sr=[1,2,3].map(i=>`<span class="star">${i<=s?'⭐':'☆'}</span>`).join('');
  const emoji=s===3?'🏆':s===2?'🌟':'💪';
  const msg=s===3?'Incrível! Você arrasou! 🏆':s===2?'Muito bem! Continue assim! 🌟':s===1?'Bom começo! Mais prática!':'Não desiste! Tente de novo!';
  if(s===3)setTimeout(confetti,100);
  const bonusMult=S._dailyBonus?2:1;
  const ptsFinal=S.score*bonusMult;
  const advMoves=P.name?`<div style="margin-top:6px;font-size:13px;color:#64748b">🌍 Total: <b>${P.totalScore} pts</b> — Estação ${P.station+1}</div>`:'';
  const newMedalHtml=S.newMedals&&S.newMedals.length?`<div class="new-medals">${S.newMedals.map(m=>`<div class="new-medal-row">🏅 Nova medalha: <b>${m.icon} ${m.name}</b></div>`).join('')}</div>`:'';
  const dailyInfo=S._dailyBonus?`<div style="background:#fef9c3;border:1.5px solid #fde68a;border-radius:10px;padding:8px;font-size:13px;font-weight:700;color:#78350f;margin-bottom:8px">⚡ Desafio Diário — pontos em dobro! +${ptsFinal} pts</div>`:'';

  app.innerHTML=`<div class="end-screen fade-in">
    <span class="bigmoji">${emoji}</span>
    <div class="stars" style="margin:10px 0">${sr}</div>
    <div class="end-title">${msg}</div>
    ${dailyInfo}
    <div class="end-stats">
      <div class="sc"><div class="sc-val">${ptsFinal}</div><div class="sc-lbl">pontos</div></div>
      <div class="sc"><div class="sc-val">${S.qNum}</div><div class="sc-lbl">acertos</div></div>
      <div class="sc"><div class="sc-val">${S.maxStreak}x</div><div class="sc-lbl">combo máx</div></div>
    </div>
    ${advMoves}
    ${newMedalHtml}
    <div class="btns">
      ${P.name?`<button class="btn btn-p" style="background:#8b5cf6" onclick="goHome()">🗺️ Mapa do Mundo</button>`:''}
      <button class="btn btn-p" style="background:${m.color}" onclick="startGame('${S.mod}','${S.topic}')">Jogar de novo</button>
    </div>
  </div>`;
}

render();
</script>
</body>
</html>
